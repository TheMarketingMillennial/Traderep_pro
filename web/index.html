<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TradeRep Pro - Professional Trade Representative Tool">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TradeRep Pro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TradeRep Pro</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Firebase JS SDK pre-loaded as ESM modules.

    firebase_core_web uses @JS('firebase_core') dart:js_interop to access
    window.firebase_core.getApps, .initializeApp, .getApp, .SDK_VERSION, etc.
    We must assign the FULL module namespace (import * as ...) so all exported
    symbols are available, not just a subset.

    Version must match supportedFirebaseJsSdkVersion in firebase_core_web 2.24.0 = 11.9.1

    When these window globals are set before Flutter boots, firebase_core_web's
    _initializeCore() sees them as non-null and skips its own async injection.
  -->
  <script type="module">
    import * as firebaseCore    from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js';
    import * as firebaseAuth    from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js';
    import * as firebaseFirestore from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js';
    import * as firebaseStorage from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-storage.js';

    // Assign full module namespaces — firebase_core_web @JS('firebase_core') interop
    // accesses window.firebase_core.getApps, .initializeApp, .getApp, .SDK_VERSION, etc.
    window.firebase_core      = firebaseCore;
    window.firebase_auth      = firebaseAuth;
    window.firebase_firestore = firebaseFirestore;
    window.firebase_storage   = firebaseStorage;
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
